<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Chat trigger: a glowing 💬 bubble pinned to the very top-left corner of
     the screen. Clicking it opens the assistant chat window. */
  #chat-trigger {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    background: rgba(13, 19, 34, 0.9);
    border: 2px solid rgba(167, 139, 250, 0.55);
    border-top: 1.5px solid rgba(255, 255, 255, 0.55);
    box-shadow:
      0 6px 20px rgba(0, 0, 0, 0.5),
      0 0 22px rgba(139, 92, 246, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
    cursor: pointer;
    z-index: 5;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, box-shadow 0.2s;
  }
  body.hover #chat-trigger {
    transform: translate(-50%, -50%) scale(1.14);
    border-color: rgba(167, 139, 250, 0.95);
    box-shadow: 0 0 26px rgba(139, 92, 246, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  #chat-trigger:active { transform: translate(-50%, -50%) scale(0.92); }
</style>
</head>
<body>
  <div id="chat-trigger" title="Open Assistant">💬</div>
  <script>
    const api = window.electronAPI || { openAssistant() {}, onButtonHover() {} };
    document.getElementById('chat-trigger').addEventListener('click', (e) => {
      e.stopPropagation();
      api.openAssistant();
    });
    api.onButtonHover((state) => {
      document.body.classList.toggle('hover', !!(state && state.chatHover));
    });
  </script>
</body>
</html>
