<!DOCTYPE html>
<html>
<head>
<title>Screenshot Overlay</title>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:100vw;
    height:100vh;
    overflow:hidden;
    cursor:crosshair;
    font-family:'Comfortaa','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 120% at 50% 38%, rgba(24, 30, 56, 0.5), rgba(5, 8, 16, 0.72) 75%),
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: auto, 34px 34px, 34px 34px;
  }
  #selection-box {
    position: absolute;
    display: none;
    pointer-events: none;
    border: 1.5px solid rgba(167, 139, 250, 0.95);
    background: rgba(139, 92, 246, 0.10);
    backdrop-filter: blur(3px) saturate(1.4);
    -webkit-backdrop-filter: blur(3px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(167, 139, 250, 0.35),
      0 0 26px rgba(139, 92, 246, 0.45),
      inset 0 0 18px rgba(139, 92, 246, 0.18);
    animation: boxGlow 1.6s ease-in-out infinite;
  }
  /* Corner brackets: pure decoration, never affects the drag rect */
  #selection-box::before,
  #selection-box::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2.5px solid rgba(255, 255, 255, 0.95);
  }
  #selection-box::before {
    top: -2px;
    left: -2px;
    border-right: none;
    border-bottom: none;
    border-top-left-radius: 6px;
  }
  #selection-box::after {
    bottom: -2px;
    right: -2px;
    border-left: none;
    border-top: none;
    border-bottom-right-radius: 6px;
  }
  @keyframes boxGlow {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(167, 139, 250, 0.35),
        0 0 20px rgba(139, 92, 246, 0.35),
        inset 0 0 18px rgba(139, 92, 246, 0.15);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(167, 139, 250, 0.55),
        0 0 34px rgba(139, 92, 246, 0.6),
        inset 0 0 22px rgba(139, 92, 246, 0.25);
    }
  }
  /* Instruction pill so the capture tool is self-explanatory */
  #hint {
    position: fixed;
    left: 50%;
    top: 22px;
    transform: translateX(-50%);
    padding: 9px 18px;
    border-radius: 999px;
    background: rgba(9, 14, 27, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #eef2ff;
    font-size: 13px;
    letter-spacing: 0.03em;
    pointer-events: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
<div id="hint">Drag to select a region — Esc to cancel</div>
<div id="selection-box"></div>
<script>
  // Defensive shim: without the preload bridge the overlay does nothing
  // instead of throwing on undefined methods.
  const api = window.electronAPI || { captureScreenshotAndClose() {}, cancelScreenshot() {} };
  let active = true;
  let startX, startY;
  const box = document.getElementById('selection-box');

  document.addEventListener('mousedown', (e) => {
    if (!active) return;
    startX = e.clientX; // window-relative: main adds the display origin
    startY = e.clientY;
    box.style.display = 'block';
    box.style.left = startX + 'px';
    box.style.top = startY + 'px';
    box.style.width = '0px';
    box.style.height = '0px';
  });

  document.addEventListener('mousemove', (e) => {
    if (!active || !startX) return;
    const x = Math.min(startX, e.clientX);
    const y = Math.min(startY, e.clientY);
    const w = Math.abs(e.clientX - startX);
    const h = Math.abs(e.clientY - startY);
    box.style.left = x + 'px';
    box.style.top = y + 'px';
    box.style.width = w + 'px';
    box.style.height = h + 'px';
  });

  document.addEventListener('mouseup', (e) => {
    if (!active || !startX) return;
    active = false;
    const x = Math.min(startX, e.clientX);
    const y = Math.min(startY, e.clientY);
    const w = Math.abs(e.clientX - startX);
    const h = Math.abs(e.clientY - startY);
    box.style.display = 'none';
    if (w >= 5 && h >= 5) {
      api.captureScreenshotAndClose({ x: Math.round(x), y: Math.round(y), width: Math.round(w), height: Math.round(h) });
    } else {
      api.cancelScreenshot();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      active = false;
      api.cancelScreenshot();
    }
  });
</script>
</body>
</html>
