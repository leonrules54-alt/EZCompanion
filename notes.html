<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    color: #e8edff;
  }
  /* The notes popup: a glass card floating LEFT of the sidebar, sized in
     main.js (full sidebar height by default; the user can drag the edges to
     resize it). */
  #notes-glass {
    position: relative;
    flex: 1;
    margin: 8px;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    background: rgba(9, 14, 27, 0.82);
    backdrop-filter: blur(14px) saturate(1.3) brightness(1.04);
    -webkit-backdrop-filter: blur(14px) saturate(1.3) brightness(1.04);
    border: 2px solid rgba(167, 139, 250, 0.45);
    border-top: 1.5px solid rgba(255, 255, 255, 0.5);
    box-shadow:
      0 14px 44px rgba(0, 0, 0, 0.5),
      0 0 34px rgba(251, 191, 36, 0.22),
      0 0 0 1.5px rgba(167, 139, 250, 0.28),
      0 0 22px rgba(139, 92, 246, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    overflow: hidden;
  }
  /* LED light strip along the top edge (matches the app's planner glass) */
  #notes-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(139, 92, 246, 0.95) 30%, rgba(236, 72, 153, 0.9) 60%, rgba(251, 191, 36, 0.9));
    -webkit-mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    opacity: 0.9;
  }
  /* Header */
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 14px 11px;
    border-bottom: 1.5px solid rgba(167, 139, 250, 0.6);
    flex-shrink: 0;
  }
  .head .title {
    flex: 1;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  /* Solid bright title — no gradient-clip (it faded the tail of the word). */
  .head .title {
    color: #fde68a;
    filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.45));
  }
  .close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.09);
    color: #9dabcf;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .close:hover {
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.35);
  }
  /* Body: BIG textarea up top, notes list below */
  .body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 12px 12px;
  }
  #notes-input {
    width: 100%;
    min-height: 130px;
    flex: 1 1 42%;
    resize: none;
    padding: 11px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    color: #e8edff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.55;
    outline: none;
    caret-color: #22d3ee;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #notes-input:focus {
    border-color: rgba(99, 102, 241, 0.65);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18), 0 0 18px rgba(99, 102, 241, 0.22);
  }
  #notes-input::placeholder { color: rgba(157, 171, 207, 0.7); }
  #notes-save {
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.03em;
    cursor: pointer;
    color: #0b1020;
    background: #22d3ee;
    box-shadow: 0 3px 14px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: all 0.15s;
  }
  #notes-save:hover {
    filter: brightness(1.12) saturate(1.05);
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(99, 102, 241, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  #notes-save:active { transform: scale(0.97); }
  /* Notes list: items show up to 2 lines so you can see more at a glance */
  .list {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
    scrollbar-width: thin;
    scrollbar-color: rgba(167, 139, 250, 0.35) transparent;
  }
  .list::-webkit-scrollbar { width: 5px; }
  .list::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.35); border-radius: 3px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .note-empty {
    font-size: 12px;
    color: #9dabcf;
    text-align: center;
    padding: 22px 12px;
    font-style: italic;
  }
  .note-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 10px;
    /* Soft diagonal amber → violet → cyan tint so the list isn't flat */
    background: rgba(255, 255, 255, 0.07);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .note-item:hover {
    background: rgba(251, 191, 36, 0.12);
    border-color: rgba(251, 191, 36, 0.35);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 12px rgba(251, 191, 36, 0.18);
    transform: translateY(-1px);
  }
  /* The note currently being edited — stays put until you update it (no
     duplicate note is created when editing; save updates it in place). */
  .note-item.editing {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.65);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 16px rgba(251, 191, 36, 0.32);
  }
  .note-text {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #e8edff;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .note-meta {
    font-size: 10px;
    font-weight: 700;
    color: #c7d2fe;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .note-acts {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .note-act {
    width: 20px;
    height: 20px;
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.1);
    color: #9dabcf;
    cursor: pointer;
    font-size: 10.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.15s, border-color 0.15s;
  }
  .note-act:hover { background: rgba(255, 255, 255, 0.28); color: #fff; transform: scale(1.12); border-color: rgba(255, 255, 255, 0.45); }
  .note-act.del:hover { background: rgba(244, 63, 94, 0.35); border-color: rgba(244, 63, 94, 0.6); }

  /* Resize grip (bottom-right corner) — the window itself is resizable, so
     this is a visual hint that the card can be stretched. */
  #notes-glass::after {
    content: '';
    position: absolute;
    right: 9px;
    bottom: 9px;
    width: 14px;
    height: 14px;
    background:
      linear-gradient(135deg, transparent 0 46%, rgba(255, 255, 255, 0.5) 46% 54%, transparent 54% 66%, rgba(255, 255, 255, 0.32) 66% 74%, transparent 74%),
      linear-gradient(45deg, transparent 0 46%, rgba(255, 255, 255, 0.5) 46% 54%, transparent 54% 66%, rgba(255, 255, 255, 0.32) 66% 74%, transparent 74%);
    pointer-events: none;
    opacity: 0.7;
  }

  /* Clean glass tooltip (replaces the native title bubble) */
  .mini-tip {
    position: fixed;
    z-index: 50;
    max-width: 220px;
    padding: 6px 10px;
    border-radius: 9px;
    background: rgba(15, 23, 42, 0.96);
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    color: #e8edff;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.01em;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .mini-tip.visible { opacity: 1; transform: translateY(0); }

</style>
<script>
  // The app ships with a single signature look: the black glass theme.
  document.body.dataset.theme = 'black';
</script>
</head>
<body>
  <div id="notes-glass">
    <div class="head">
      <span class="title">📝 Quick Notes</span>
      <button class="close" id="notes-close" title="Close">✕</button>
    </div>
    <div class="body">
      <textarea id="notes-input" placeholder="Write a quick note…"></textarea>
      <button id="notes-save">Save note</button>
      <div class="list" id="notes-list"></div>
    </div>
  </div>
  <script>
    // Defensive shim: if the preload bridge is missing (plain browser), the
    // panel still works — clipboard copy just falls back to navigator.
    const api = window.electronAPI || {
      writeClipboard: (t) => navigator.clipboard.writeText(t).then(() => true),
      closeNotes() {},
    };

    // === Clean glass tooltips (replaces native title bubbles) ===
    const tipEl = document.createElement('div');
    tipEl.className = 'mini-tip';
    document.body.appendChild(tipEl);
    let tipTimer = null;
    function tipFor(el, text) {
      if (tipTimer) clearTimeout(tipTimer);
      tipTimer = setTimeout(() => {
        tipEl.textContent = text;
        const r = el.getBoundingClientRect();
        const w = Math.min(220, tipEl.offsetWidth || 120);
        const h = tipEl.offsetHeight || 26;
        const cw = document.documentElement.clientWidth;
        const ch = document.documentElement.clientHeight;
        let left = r.left + r.width / 2 - w / 2;
        left = Math.max(4, Math.min(left, cw - w - 4));
        const top = r.top > 70 ? r.top - h - 10 : r.bottom + 10;
        tipEl.style.left = left + 'px';
        tipEl.style.top = Math.max(4, Math.min(top, ch - h - 4)) + 'px';
        tipEl.classList.add('visible');
      }, 160);
    }
    function tipHide() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      tipEl.classList.remove('visible');
    }
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest('[title],[data-tip]');
      if (!el) return tipHide();
      let text = el.dataset.tip;
      if (text == null) {
        text = el.getAttribute('title') || '';
        if (!text) return tipHide();
        el.setAttribute('data-tip', text);
        el.removeAttribute('title');
      }
      tipFor(el, text);
    });
    document.addEventListener('mouseout', (e) => {
      const from = e.target.closest && e.target.closest('[title],[data-tip]');
      const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[title],[data-tip]') : null;
      if (from && from !== to) tipHide();
    });

    // Notes are shared with the main app through localStorage (same file://
    // origin in Electron), keyed 'wolf-notes'.
    let notes = load();
    function load() {
      try { return JSON.parse(localStorage.getItem('wolf-notes')) || []; } catch (e) { return []; }
    }
    function save() { localStorage.setItem('wolf-notes', JSON.stringify(notes)); }

    // id of the note being edited (null = composing a brand-new note).
    let editingId = null;

    const input = document.getElementById('notes-input');
    const listEl = document.getElementById('notes-list');
    const saveBtn = document.getElementById('notes-save');

    function updateSaveLabel() {
      saveBtn.textContent = editingId !== null ? 'Update note ✏️' : 'Save note';
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'now';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h';
      return Math.floor(h / 24) + 'd';
    }

    function render() {
      listEl.innerHTML = '';
      if (!notes.length) {
        listEl.innerHTML = '<div class="note-empty">No notes yet — jot something down! ✍️</div>';
        return;
      }
      notes.forEach((n) => {
        const row = document.createElement('div');
        row.className = 'note-item';

        const txt = document.createElement('span');
        txt.className = 'note-text';
        txt.textContent = n.text;

        const meta = document.createElement('span');
        meta.className = 'note-meta';
        meta.textContent = timeAgo(n.time);

        const acts = document.createElement('span');
        acts.className = 'note-acts';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'note-act';
        copyBtn.textContent = '📋';
        copyBtn.title = 'Copy note';
        copyBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          api.writeClipboard(n.text).then(() => flash(ev.target));
        });
        const delBtn = document.createElement('button');
        delBtn.className = 'note-act del';
        delBtn.textContent = '🗑';
        delBtn.title = 'Delete note';
        delBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          notes = notes.filter((x) => x.id !== n.id);
          if (editingId === n.id) { editingId = null; updateSaveLabel(); }
          save();
          render();
        });
        acts.append(copyBtn, delBtn);

        row.append(txt, meta, acts);
        // Click a saved note to load it into the big textarea for editing —
        // it stays in place and gets updated on save (never duplicated).
        row.addEventListener('click', () => {
          editingId = n.id;
          input.value = n.text;
          updateSaveLabel();
          render(); // re-highlight the editing note
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        });
        if (n.id === editingId) row.classList.add('editing');
        listEl.appendChild(row);
      });
    }

    function flash(btn) {
      btn.style.background = 'rgba(52, 211, 153, 0.5)';
      btn.style.color = '#fff';
      setTimeout(() => { btn.style.background = ''; btn.style.color = ''; }, 350);
    }

    function saveCurrentNote() {
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      if (editingId !== null) {
        // Editing: update the existing note in place (text + timestamp),
        // keeping its position in the list — no duplicate is created.
        const n = notes.find((x) => x.id === editingId);
        if (n) { n.text = text; n.time = Date.now(); }
        editingId = null;
      } else {
        notes.unshift({ id: Date.now(), text, time: Date.now() });
        notes = notes.slice(0, 50);
      }
      save();
      input.value = '';
      updateSaveLabel();
      render();
      input.focus();
    }

    document.getElementById('notes-save').addEventListener('click', saveCurrentNote);
    document.getElementById('notes-close').addEventListener('click', () => { if (api.closeNotes) api.closeNotes(); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveCurrentNote(); });

    render();
    // Focus the textarea once the window is actually visible — main.js shows
    // the window after the page finishes loading, so a focus() at parse time
    // would be dropped before the user can start typing.
    window.addEventListener('focus', () => input.focus());
    setTimeout(() => input.focus(), 60);
  </script>
</body>
</html>
