<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    color: #e8edff;
  }
  /* The notes popup: a glass card floating LEFT of the sidebar, sized in
     main.js (full sidebar height by default; the user can drag the edges to
     resize it). */
  #notes-glass {
    position: relative;
    flex: 1;
    margin: 8px;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    -webkit-backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    border: 1px solid rgba(var(--accent), 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
      inset 0 0 12px rgba(var(--accent), 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 14px 44px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(var(--accent), 0.12),
      0 0 30px rgba(var(--accent), 0.10);
    overflow: hidden;
  }
  /* LED light strip along the top edge (matches the app's planner glass) */
  #notes-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(139, 92, 246, 0.95) 30%, rgba(236, 72, 153, 0.9) 60%, rgba(251, 191, 36, 0.9));
    -webkit-mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    opacity: 0.9;
  }
  /* Header */
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 14px 11px;
    border-bottom: 1.5px solid rgba(167, 139, 250, 0.6);
    flex-shrink: 0;
  }
  .head .title {
    flex: 1;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  /* Solid bright title — no gradient-clip (it faded the tail of the word). */
  .head .title {
    color: #fde68a;
    filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.45));
  }
  .close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.09);
    color: #9dabcf;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .close:hover {
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
    transform: scale(1.1);
    border-color: rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.35);
  }
  /* Body: BIG textarea up top, notes list below */
  .body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 12px 12px;
  }
  #notes-input {
    width: 100%;
    min-height: 130px;
    flex: 1 1 42%;
    resize: none;
    padding: 11px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    color: #e8edff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.55;
    outline: none;
    caret-color: #22d3ee;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #notes-input:focus {
    border-color: rgba(99, 102, 241, 0.65);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18), 0 0 18px rgba(99, 102, 241, 0.22);
  }
  #notes-input::placeholder { color: rgba(157, 171, 207, 0.7); }
  .new {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid rgba(163, 230, 53, 0.5);
    background: rgba(163, 230, 53, 0.12);
    color: #d9f99d;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .new:hover {
    background: rgba(163, 230, 53, 0.28);
    color: #fff;
    transform: scale(1.1);
    border-color: rgba(163, 230, 53, 0.85);
    box-shadow: 0 0 12px rgba(163, 230, 53, 0.45);
  }
  .new:active { transform: scale(0.94); }
  /* Notes list: items show up to 2 lines so you can see more at a glance */
  .list {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
    scrollbar-width: thin;
    scrollbar-color: rgba(167, 139, 250, 0.35) transparent;
  }
  .list::-webkit-scrollbar { width: 5px; }
  .list::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.35); border-radius: 3px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .note-empty {
    font-size: 12px;
    color: #9dabcf;
    text-align: center;
    padding: 22px 12px;
    font-style: italic;
  }
  .note-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 10px;
    /* Soft diagonal amber → violet → cyan tint so the list isn't flat */
    background: rgba(255, 255, 255, 0.07);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .note-item:hover {
    background: rgba(251, 191, 36, 0.12);
    border-color: rgba(251, 191, 36, 0.35);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 12px rgba(251, 191, 36, 0.18);
    transform: translateY(-1px);
  }
  /* The note currently being edited — stays put until you update it (no
     duplicate note is created when editing; save updates it in place). */
  .note-item.editing {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.65);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 16px rgba(251, 191, 36, 0.32);
  }
  .note-text {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #e8edff;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .note-meta {
    font-size: 10px;
    font-weight: 700;
    color: #c7d2fe;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .note-acts {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .note-act {
    width: 20px;
    height: 20px;
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.1);
    color: #9dabcf;
    cursor: pointer;
    font-size: 10.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.15s, border-color 0.15s;
  }
  .note-act:hover { background: rgba(255, 255, 255, 0.28); color: #fff; transform: scale(1.12); border-color: rgba(255, 255, 255, 0.45); }
  .note-act.del:hover { background: rgba(244, 63, 94, 0.35); border-color: rgba(244, 63, 94, 0.6); }

  /* Resize grip (bottom-right corner) — the window itself is resizable, so
     this is a visual hint that the card can be stretched. */
  #notes-glass::after {
    content: '';
    position: absolute;
    right: 9px;
    bottom: 9px;
    width: 14px;
    height: 14px;
    background:
      linear-gradient(135deg, transparent 0 46%, rgba(255, 255, 255, 0.5) 46% 54%, transparent 54% 66%, rgba(255, 255, 255, 0.32) 66% 74%, transparent 74%),
      linear-gradient(45deg, transparent 0 46%, rgba(255, 255, 255, 0.5) 46% 54%, transparent 54% 66%, rgba(255, 255, 255, 0.32) 66% 74%, transparent 74%);
    pointer-events: none;
    opacity: 0.7;
  }

  /* Clean glass tooltip (replaces the native title bubble) */
  .mini-tip {
    position: fixed;
    z-index: 50;
    max-width: 220px;
    padding: 6px 10px;
    border-radius: 9px;
    background: rgba(15, 23, 42, 0.96);
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    color: #e8edff;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.01em;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .mini-tip.visible { opacity: 1; transform: translateY(0); }

  /* Lightweight entrance (transform + opacity only — compositor-safe) */
  #notes-glass { animation: winIn 0.24s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  @keyframes winIn { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    /* Planner-matched accent (synced from the daily protocol) */
  :root { --accent: 0, 242, 255; --accent-hex: #00f2ff; }
  body[data-protocol="productive"] { --accent: 56, 189, 248;  --accent-hex: #38bdf8; }
  body[data-protocol="workout"]    { --accent: 251, 113, 133; --accent-hex: #fb7185; }
  body[data-protocol="rest"]       { --accent: 167, 139, 250; --accent-hex: #a78bfa; }
  body[data-protocol="play"]       { --accent: 52, 211, 153;  --accent-hex: #34d399; }
  /* Neon LED strip along the top edge (matches the planner) */
  #notes-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(139, 92, 246, 0.95) 30%, rgba(236, 72, 153, 0.9) 60%, rgba(52, 211, 153, 0.9));
    -webkit-mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    opacity: 0.9;
  }
    /* Navy gradient border + black middle (matches the planner's colored panes) */
  #notes-glass {
    background:
      linear-gradient(160deg, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
      radial-gradient(130% 90% at 0% 0%, rgba(30, 64, 175, 0.34), transparent 55%),
      radial-gradient(130% 90% at 100% 100%, rgba(37, 99, 235, 0.26), transparent 55%),
      rgba(2, 5, 11, 0.86);
    border: 1.5px solid rgba(59, 130, 246, 0.5);
    box-shadow:
      inset 0 0 26px rgba(30, 64, 175, 0.24),
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 18px 50px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(59, 130, 246, 0.25),
      0 0 36px rgba(30, 64, 175, 0.28);
  }
  </style>
<script>
  // The app ships with a single signature look: the black glass theme.
  document.body.dataset.theme = 'black';
</script>
</head>
<body>
  <div id="notes-glass">
    <div class="head">
      <span class="title">📝 Quick Notes</span>
      <button class="new" id="notes-new" title="New note">＋</button>
      <button class="close" id="notes-close" title="Close">✕</button>
    </div>
    <div class="body">
      <textarea id="notes-input" placeholder="Write a quick note… (saves automatically)"></textarea>
      <div class="list" id="notes-list"></div>
    </div>
  </div>
  <script>
    // Defensive shim: if the preload bridge is missing (plain browser), the
    // panel still works — clipboard copy just falls back to navigator.
    const api = window.electronAPI || {
      writeClipboard: (t) => navigator.clipboard.writeText(t).then(() => true),
      closeNotes() {},
    };

    // === Clean glass tooltips (replaces native title bubbles) ===
    const tipEl = document.createElement('div');
    tipEl.className = 'mini-tip';
    document.body.appendChild(tipEl);
    let tipTimer = null;
    function tipFor(el, text) {
      if (tipTimer) clearTimeout(tipTimer);
      tipTimer = setTimeout(() => {
        tipEl.textContent = text;
        const r = el.getBoundingClientRect();
        const w = Math.min(220, tipEl.offsetWidth || 120);
        const h = tipEl.offsetHeight || 26;
        const cw = document.documentElement.clientWidth;
        const ch = document.documentElement.clientHeight;
        let left = r.left + r.width / 2 - w / 2;
        left = Math.max(4, Math.min(left, cw - w - 4));
        const top = r.top > 70 ? r.top - h - 10 : r.bottom + 10;
        tipEl.style.left = left + 'px';
        tipEl.style.top = Math.max(4, Math.min(top, ch - h - 4)) + 'px';
        tipEl.classList.add('visible');
      }, 160);
    }
    function tipHide() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      tipEl.classList.remove('visible');
    }
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest('[title],[data-tip]');
      if (!el) return tipHide();
      let text = el.dataset.tip;
      if (text == null) {
        text = el.getAttribute('title') || '';
        if (!text) return tipHide();
        el.setAttribute('data-tip', text);
        el.removeAttribute('title');
      }
      tipFor(el, text);
    });
    document.addEventListener('mouseout', (e) => {
      const from = e.target.closest && e.target.closest('[title],[data-tip]');
      const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[title],[data-tip]') : null;
      if (from && from !== to) tipHide();
    });

    // Notes are shared with the main app through localStorage (same file://
    // origin in Electron), keyed 'wolf-notes'.
    let notes = load();
    function load() {
      try { return JSON.parse(localStorage.getItem('wolf-notes')) || []; } catch (e) { return []; }
    }
    function save() { localStorage.setItem('wolf-notes', JSON.stringify(notes)); }

    // The note currently shown in the textarea. null = composing a fresh note.
    // It persists (key 'wolf-notes-open') so the last note you were reading
    // stays open the next time you open Quick Notes.
    let openId = null;

    const input = document.getElementById('notes-input');
    const listEl = document.getElementById('notes-list');

    function persistOpen() {
      try { localStorage.setItem('wolf-notes-open', openId == null ? '' : String(openId)); } catch (e) {}
    }
    function readOpen() {
      try {
        const v = localStorage.getItem('wolf-notes-open');
        return v ? Number(v) : null;
      } catch (e) { return null; }
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'now';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h';
      return Math.floor(h / 24) + 'd';
    }

    function render() {
      const prevScroll = listEl.scrollTop;
      listEl.innerHTML = '';
      if (!notes.length) {
        listEl.innerHTML = '<div class="note-empty">No notes yet — jot something down! ✍️</div>';
        return;
      }
      notes.forEach((n) => {
        const row = document.createElement('div');
        row.className = 'note-item';

        const txt = document.createElement('span');
        txt.className = 'note-text';
        txt.textContent = n.text;

        const meta = document.createElement('span');
        meta.className = 'note-meta';
        meta.textContent = timeAgo(n.time);

        const acts = document.createElement('span');
        acts.className = 'note-acts';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'note-act';
        copyBtn.textContent = '📋';
        copyBtn.title = 'Copy note';
        copyBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          api.writeClipboard(n.text).then(() => flash(ev.target));
        });
        const delBtn = document.createElement('button');
        delBtn.className = 'note-act del';
        delBtn.textContent = '🗑';
        delBtn.title = 'Delete note';
        delBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          notes = notes.filter((x) => x.id !== n.id);
          if (openId === n.id) { openId = null; input.value = ''; persistOpen(); }
          save();
          render();
        });
        acts.append(copyBtn, delBtn);

        row.append(txt, meta, acts);
        // Click a saved note to open it in the big textarea.
        row.addEventListener('click', () => openNote(n.id));
        if (n.id === openId) row.classList.add('editing');
        listEl.appendChild(row);
      });
      listEl.scrollTop = Math.min(prevScroll, listEl.scrollHeight);
    }

    function flash(btn) {
      btn.style.background = 'rgba(52, 211, 153, 0.5)';
      btn.style.color = '#fff';
      setTimeout(() => { btn.style.background = ''; btn.style.color = ''; }, 350);
    }

    function openNote(id) {
      openId = id;
      const n = notes.find((x) => x.id === id);
      input.value = n ? n.text : '';
      persistOpen();
      render();
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }

    function newNote() {
      flushSave(); // commit anything still pending before starting fresh
      openId = null;
      input.value = '';
      persistOpen();
      render();
      input.focus();
    }

    // Autosave: typing updates the open note in place and saves in real time
    // (debounced so localStorage isn't thrashed on every keystroke).
    let saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 350);
    }
    function flushSave() {
      clearTimeout(saveTimer);
      saveTimer = null;
      const text = input.value.trim();
      if (!text) {
        // Empty note: drop the one we were editing (an empty note is useless).
        if (openId != null) {
          notes = notes.filter((x) => x.id !== openId);
          openId = null;
          persistOpen();
          save();
          render();
        }
        return;
      }
      if (openId != null) {
        const n = notes.find((x) => x.id === openId);
        if (n) { n.text = text; n.time = Date.now(); }
        else openId = null; // note deleted elsewhere — fall through to create
      }
      if (openId == null) {
        openId = Date.now();
        notes.unshift({ id: openId, text, time: Date.now() });
        notes = notes.slice(0, 50);
        persistOpen();
      }
      save();
      render();
    }

    input.addEventListener('input', scheduleSave);
    input.addEventListener('blur', flushSave);
    document.getElementById('notes-new').addEventListener('click', newNote);
    document.getElementById('notes-close').addEventListener('click', () => {
      flushSave();
      if (api.closeNotes) api.closeNotes();
    });

    // Restore the last-open note (or the most recent one on first ever open).
    const savedId = readOpen();
    const initial = notes.find((x) => x.id === savedId) || notes[0] || null;
    openId = initial ? initial.id : null;
    input.value = initial ? initial.text : '';
    persistOpen();
    render();
    // Focus the textarea once the window is actually visible — main.js shows
    // the window after the page finishes loading, so a focus() at parse time
    // would be dropped before the user can start typing.
    window.addEventListener('focus', () => input.focus());
    setTimeout(() => input.focus(), 60);
  </script>
<script>
  (function () {
    var api = window.electronAPI;
    function apply(p) {
      if (p === 'productive' || p === 'workout' || p === 'rest' || p === 'play') document.body.dataset.protocol = p;
      else delete document.body.dataset.protocol;
    }
    if (api && api.onProtocol) api.onProtocol(apply);
    if (api && api.getProtocol) api.getProtocol();
  })();
</script>
  <script src="summon.js"></script>
</body>
</html>
