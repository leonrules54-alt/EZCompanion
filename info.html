<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .card {
    position: absolute;
    inset: 10px;
    border-radius: 20px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    -webkit-backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    border: 1px solid rgba(var(--accent), 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
      inset 0 0 12px rgba(var(--accent), 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 16px 50px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(var(--accent), 0.12),
      0 0 30px rgba(var(--accent), 0.10);
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    color: #e8edff;
  }

  .head {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }
  .head .logo { font-size: 18px; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8)); }
  .head .title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #a5b4fc;
  }
  .close {
    -webkit-app-region: no-drag;
    margin-left: auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: #e8edff;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .close:hover { background: rgba(244, 63, 94, 0.35); border-color: rgba(244, 63, 94, 0.7); }

  .clock {
    text-align: center;
    padding: 10px 0 2px;
  }
  .clock .time {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
  }
  .clock .date {
    font-size: 13px;
    font-weight: 600;
    color: #a5b4fc;
    margin-top: 2px;
  }

  .weather {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 0;
  }
  .weather .icon { font-size: 30px; }
  .weather .temp { font-size: 22px; font-weight: 800; color: #7dd3fc; }
  .weather .desc { font-size: 12px; font-weight: 600; color: #94a3b8; }

  .w-meta {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    padding: 0 0 6px;
  }

  .quote {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    color: #c4b5fd;
    text-align: center;
    font-weight: 600;
    line-height: 1.45;
  }
  /* Lightweight entrance (transform + opacity only — compositor-safe) */
  .card { animation: winIn 0.24s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  @keyframes winIn { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    /* Planner-matched accent (synced from the daily protocol) */
  :root { --accent: 0, 242, 255; --accent-hex: #00f2ff; }
  body[data-protocol="productive"] { --accent: 56, 189, 248;  --accent-hex: #38bdf8; }
  body[data-protocol="workout"]    { --accent: 251, 113, 133; --accent-hex: #fb7185; }
  body[data-protocol="rest"]       { --accent: 167, 139, 250; --accent-hex: #a78bfa; }
  body[data-protocol="play"]       { --accent: 52, 211, 153;  --accent-hex: #34d399; }
  /* Neon LED strip along the top edge (matches the planner) */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(139, 92, 246, 0.95) 30%, rgba(236, 72, 153, 0.9) 60%, rgba(52, 211, 153, 0.9));
    -webkit-mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    opacity: 0.9;
  }
    /* Navy gradient border + black middle (matches the planner's colored panes) */
  .card {
    background:
      linear-gradient(160deg, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
      radial-gradient(130% 90% at 0% 0%, rgba(30, 64, 175, 0.34), transparent 55%),
      radial-gradient(130% 90% at 100% 100%, rgba(37, 99, 235, 0.26), transparent 55%),
      rgba(2, 5, 11, 0.86);
    border: 1.5px solid rgba(59, 130, 246, 0.5);
    box-shadow:
      inset 0 0 26px rgba(30, 64, 175, 0.24),
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 18px 50px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(59, 130, 246, 0.25),
      0 0 36px rgba(30, 64, 175, 0.28);
  }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="logo">ℹ️</span>
      <span class="title">Info &amp; Weather</span>
      <button class="close" id="info-close" title="Close">✕</button>
    </div>
    <div class="clock">
      <div class="time" id="i-time">12:00</div>
      <div class="date" id="i-date">Loading…</div>
    </div>
    <div class="weather">
      <span class="icon" id="i-wicon">☀️</span>
      <span class="temp" id="i-wtemp">72°F</span>
      <span class="desc" id="i-wdesc">Sunny</span>
    </div>
    <div class="w-meta" id="i-wmeta"></div>
    <div class="quote" id="i-quote">You're doing great today! ✨</div>
  </div>

  <script src="weather.js"></script>
  <script>
    const api = window.electronAPI || { closeInfo() {} };
    document.getElementById('info-close').addEventListener('click', () => api.closeInfo());

    const QUOTES = [
      "You're doing great today! ✨", 'Every step forward counts. 🌱',
      "Take a deep breath — you've got this. 💪", 'Small progress is still progress. 🌻',
      'You are capable of amazing things. ⭐', 'One task at a time. You rule! 🎯',
      'Rest is productive too. 😌', 'Believe in yourself — I do! 💖',
    ];
    document.getElementById('i-quote').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];

    // Live forecast via the shared WolfWeather module (Open-Meteo, cached in
    // localStorage so this window and the planner reuse one fetch).
    async function renderWeather() {
      const w = (window.WolfWeather && window.WolfWeather.get)
        ? await window.WolfWeather.get()
        : { ok: false, icon: '—', temp: '', desc: 'Weather unavailable', city: '' };
      document.getElementById('i-wicon').textContent = w.icon || '—';
      document.getElementById('i-wtemp').textContent = w.temp || '';
      document.getElementById('i-wdesc').textContent = w.desc || '';
      const meta = document.getElementById('i-wmeta');
      if (meta) {
        const parts = [];
        if (w.city) parts.push(w.city);
        if (w.hi != null && w.lo != null) parts.push('H ' + w.hi + '° · L ' + w.lo + '°');
        meta.textContent = parts.join(' · ');
      }
    }
    renderWeather();
    setInterval(renderWeather, 600000);

    function tick() {
      const now = new Date();
      document.getElementById('i-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('i-date').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  </script>
<script>
  (function () {
    var api = window.electronAPI;
    function apply(p) {
      if (p === 'productive' || p === 'workout' || p === 'rest' || p === 'play') document.body.dataset.protocol = p;
      else delete document.body.dataset.protocol;
    }
    if (api && api.onProtocol) api.onProtocol(apply);
    if (api && api.getProtocol) api.getProtocol();
  })();
</script>
  <script src="summon.js"></script>
</body>
</html>
