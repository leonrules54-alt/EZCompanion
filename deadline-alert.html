<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deadline Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    color: #eef2ff;
  }

  /* Full-screen animated backdrop: dark vignette + drifting aurora glows.
     Only transform/opacity animate, so it stays cheap on the GPU. */
  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 120% at 50% 40%, rgba(20, 12, 30, 0.86), rgba(5, 6, 14, 0.94)),
      rgba(5, 6, 14, 0.72);
  }
  .glow {
    position: absolute;
    border-radius: 50%;
    will-change: transform, opacity;
    pointer-events: none;
  }
  /* Soft multi-stop radial fades — no filter: blur() (a 50vmax blur at
     fullscreen is a constant GPU tax; the gradient already fades out). */
  .glow.g1 {
    width: 52vmax; height: 52vmax;
    left: -12vmax; top: -14vmax;
    background: radial-gradient(circle, rgba(244, 63, 94, 0.42), rgba(244, 63, 94, 0.12) 45%, transparent 70%);
    animation: drift1 9s ease-in-out infinite alternate;
  }
  .glow.g2 {
    width: 46vmax; height: 46vmax;
    right: -10vmax; bottom: -12vmax;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.34), rgba(251, 191, 36, 0.1) 45%, transparent 70%);
    animation: drift2 11s ease-in-out infinite alternate;
  }
  .glow.g3 {
    width: 34vmax; height: 34vmax;
    left: 30%; top: 18%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.32), rgba(139, 92, 246, 0.1) 45%, transparent 70%);
    animation: drift3 13s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(7vmax, 5vmax) scale(1.12); opacity: 0.8; } }
  @keyframes drift2 { to { transform: translate(-6vmax, -4vmax) scale(1.08); opacity: 0.75; } }
  @keyframes drift3 { to { transform: translate(-5vmax, 6vmax) scale(1.15); opacity: 0.9; } }

  /* Pulsing light band sweeping across the screen — a 200%-wide layer that
     slides with transform only (background-position repaints the whole
     screen every frame; transform is composited on the GPU). */
  .sweep {
    position: absolute;
    top: 0; left: 0;
    width: 200%; height: 100%;
    background: linear-gradient(115deg, transparent 44%, rgba(255, 255, 255, 0.05) 50%, transparent 56%);
    animation: sweep 6s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes sweep {
    0% { transform: translateX(0); }
    50% { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }

  /* Centered alert card */
  .card {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, 88vw);
    padding: 42px 40px 38px;
    border-radius: 26px;
    text-align: center;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    -webkit-backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    border: 1px solid rgba(var(--accent), 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
      0 24px 80px rgba(0, 0, 0, 0.6),
      0 0 60px rgba(244, 63, 94, 0.35),
      0 0 0 1.5px rgba(167, 139, 250, 0.28),
      0 0 30px rgba(139, 92, 246, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
    animation: cardIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translate(-50%, -46%) scale(0.92); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  /* LED strip along the top edge (matches the app's planner glass) */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(244, 63, 94, 0.95), rgba(251, 191, 36, 0.9) 50%, rgba(244, 63, 94, 0.95));
    -webkit-mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    opacity: 0.95;
  }

  /* Pulsing alarm rings behind the icon */
  .icon-wrap { position: relative; width: 108px; height: 108px; margin: 0 auto 16px; }
  .ring {
    position: absolute;
    left: 50%; top: 50%;
    width: 104px; height: 104px;
    margin: -52px 0 0 -52px;
    border-radius: 50%;
    border: 2px solid rgba(244, 63, 94, 0.55);
    animation: ringPulse 1.8s ease-out infinite;
    pointer-events: none;
  }
  .ring.r2 { animation-delay: 0.6s; }
  .ring.r3 { animation-delay: 1.2s; }
  @keyframes ringPulse {
    0%   { transform: scale(0.7); opacity: 0.9; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .icon {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 58px;
    animation: iconShake 1.1s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(244, 63, 94, 0.8));
  }
  @keyframes iconShake {
    0%, 100% { transform: translate(-50%, -50%) rotate(0); }
    15% { transform: translate(-50%, -52%) rotate(-8deg); }
    30% { transform: translate(-50%, -50%) rotate(7deg); }
    45% { transform: translate(-50%, -52%) rotate(-5deg); }
    60% { transform: translate(-50%, -50%) rotate(3deg); }
  }

  .title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .title {
      background: #fb7185;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  }
  .title { filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.5)); }

  /* Conflict variant: amber warning instead of the red alarm */
  .card.conflict::before {
    background: linear-gradient(90deg, rgba(251, 191, 36, 0.95), rgba(244, 63, 94, 0.85) 50%, rgba(251, 191, 36, 0.95));
  }
  .card.conflict .ring { border-color: rgba(251, 191, 36, 0.6); }
  .card.conflict .icon { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.85)); }
  .card.conflict .title {
    background: #fbbf24;
    filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.5));
  }

  .name {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.25;
    color: #ffffff;
    text-shadow: 0 0 24px rgba(251, 191, 36, 0.45);
    word-break: break-word;
    margin-bottom: 8px;
  }
  .meta {
    font-size: 13px;
    color: #fda4af;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .divider {
    height: 1px;
    margin: 22px auto 20px;
    width: 70%;
    background: linear-gradient(90deg, transparent, rgba(244, 63, 94, 0.5), transparent);
  }

  /* Acknowledge checkbox — the required interaction to dismiss the alert */
  .ack {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    border-radius: 16px;
    cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: all 0.18s;
  }
  .ack:hover {
    background: rgba(52, 211, 153, 0.14);
    border-color: rgba(52, 211, 153, 0.55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 22px rgba(52, 211, 153, 0.3);
    transform: translateY(-1px);
  }
  .ack input {
    appearance: none;
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.05);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
  }
  .ack input:checked {
    background: #34d399;
    border-color: #a7f3d0;
    box-shadow: 0 0 18px rgba(52, 211, 153, 0.6);
  }
  .ack input:checked::after {
    content: '✓';
    color: #06281c;
    font-size: 15px;
    font-weight: 900;
  }
  .ack-label {
    font-size: 14px;
    font-weight: 700;
    color: #eef2ff;
    letter-spacing: 0.02em;
  }

  /* Conflict action buttons */
  .conflict-actions { display: flex; gap: 12px; justify-content: center; }
  .conflict-actions[hidden] { display: none; }
  .cbtn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 14px;
    cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.08);
    color: #eef2ff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: all 0.18s;
  }
  .cbtn.keep:hover { background: rgba(52, 211, 153, 0.18); border-color: rgba(52, 211, 153, 0.6); }
  .cbtn.remove:hover { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.65); }

  /* After checking: quick success flash before the window closes */
  .acked .card {
    animation: ackOut 0.45s ease-in forwards;
  }
  .acked .bg { animation: fadeBg 0.45s ease-in forwards; }
  @keyframes ackOut { to { opacity: 0; transform: translate(-50%, -50%) scale(1.06); } }
  @keyframes fadeBg { to { opacity: 0; } }
  /* Planner-matched accent (synced from the daily protocol) */
  :root { --accent: 0, 242, 255; --accent-hex: #00f2ff; }
  body[data-protocol="productive"] { --accent: 56, 189, 248;  --accent-hex: #38bdf8; }
  body[data-protocol="workout"]    { --accent: 251, 113, 133; --accent-hex: #fb7185; }
  body[data-protocol="rest"]       { --accent: 167, 139, 250; --accent-hex: #a78bfa; }
  body[data-protocol="play"]       { --accent: 52, 211, 153;  --accent-hex: #34d399; }
    /* Navy gradient border + black middle (matches the planner's colored panes) */
  .card {
    background:
      linear-gradient(160deg, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
      radial-gradient(130% 90% at 0% 0%, rgba(30, 64, 175, 0.34), transparent 55%),
      radial-gradient(130% 90% at 100% 100%, rgba(37, 99, 235, 0.26), transparent 55%),
      rgba(2, 5, 11, 0.86);
    border: 1.5px solid rgba(59, 130, 246, 0.5);
    box-shadow:
      inset 0 0 26px rgba(30, 64, 175, 0.24),
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 18px 50px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(59, 130, 246, 0.25),
      0 0 36px rgba(30, 64, 175, 0.28);
  }
  </style>
</head>
<body>
  <div class="bg" id="bg">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <div class="sweep"></div>
  </div>

  <div class="card" id="card">
    <div class="icon-wrap">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="icon">🚨</div>
    </div>
    <div class="title">⏰ Deadline time</div>
    <div class="name" id="alert-name">Loading…</div>
    <div class="meta" id="alert-meta"></div>
    <div class="divider"></div>
    <label class="ack" id="ack">
      <input type="checkbox" id="ack-check">
      <span class="ack-label">I acknowledge this deadline</span>
    </label>
    <div class="conflict-actions" id="conflict-actions" hidden>
      <button class="cbtn keep" id="conflict-keep">Keep both</button>
      <button class="cbtn remove" id="conflict-remove">Remove the new one</button>
    </div>
  </div>

  <script>
    // Defensive shim: the alert only runs in Electron (main.js opens this
    // window and pushes the deadline data over IPC).
    const api = window.electronAPI || {
      ackDeadlineAlert() {},
      onDeadlineAlertData() {},
      resolveConflict() {},
    };

    let currentId = null;
    let currentNewId = null;

    function render(dl) {
      if (!dl) return;
      currentId = dl.id;
      currentNewId = dl.newId || null;
      const conflict = dl.kind === 'conflict';
      document.getElementById('ack').hidden = conflict;
      document.getElementById('conflict-actions').hidden = !conflict;
      document.getElementById('alert-name').textContent = dl.name;
      document.getElementById('alert-meta').textContent =
        conflict ? (dl.time || '') : (dl.time ? 'Due at ' + dl.time : 'Due now');
      document.querySelector('.title').textContent = conflict ? '⚠️ Schedule conflict' : '⏰ Deadline time';
      document.querySelector('.icon').textContent = conflict ? '⚠️' : '🚨';
      document.querySelector('.ack-label').textContent = conflict ? "I'll resolve this" : 'I acknowledge this deadline';
      document.getElementById('card').classList.toggle('conflict', conflict);
      document.body.classList.remove('acked');
      const cb = document.getElementById('ack-check');
      cb.checked = false; // a fresh alert needs a fresh acknowledgment
      // Restart the shake/pulse so the animation feels alive for each alert.
      const icon = document.querySelector('.icon');
      icon.style.animation = 'none';
      void icon.offsetWidth;
      icon.style.animation = '';
    }

    api.onDeadlineAlertData(render);

    // The checkbox is the ONLY way to dismiss — it acknowledges the deadline.
    document.getElementById('ack-check').addEventListener('change', (e) => {
      if (!e.target.checked) return;
      const id = currentId; // capture now — a new alert could render mid-animation
      document.body.classList.add('acked');
      setTimeout(() => api.ackDeadlineAlert(id), 420);
    });

    // Conflict buttons: keep both (just dismiss) or remove the new deadline.
    document.getElementById('conflict-keep').addEventListener('click', () => {
      document.body.classList.add('acked');
      setTimeout(() => api.ackDeadlineAlert(currentId), 300);
    });
    document.getElementById('conflict-remove').addEventListener('click', () => {
      if (api.resolveConflict) api.resolveConflict(currentNewId);
      document.body.classList.add('acked');
      setTimeout(() => api.ackDeadlineAlert(currentId), 300);
    });
  </script>
<script>
  (function () {
    var api = window.electronAPI;
    function apply(p) {
      if (p === 'productive' || p === 'workout' || p === 'rest' || p === 'play') document.body.dataset.protocol = p;
      else delete document.body.dataset.protocol;
    }
    if (api && api.onProtocol) api.onProtocol(apply);
    if (api && api.getProtocol) api.getProtocol();
  })();
</script>
</body>
</html>
