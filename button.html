<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EZCompanion Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* === Unique launcher button: a hexagonal glass gem with a spinning neon
     halo. Sits dead-centre of this tiny window (the window is sized to fit
     the open ring menu around it). Clicking it opens the feature ring. === */
  #launcher-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 116px;
    height: 116px;
    z-index: 5;
    cursor: pointer;
  }

  /* Conic rainbow halo that slowly spins behind the hexagon */
  #launcher-wrap::before {
    content: '';
    position: absolute;
    inset: -13px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg, #6366f1, #38bdf8, #22d3ee, #34d399, #fbbf24, #f472b6, #ec4899, #a78bfa, #6366f1);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.8));
    animation: haloSpin 7s linear infinite;
    opacity: 0.9;
  }
  /* Soft ambient bloom around the button */
  #launcher-wrap::after {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.35), rgba(34, 211, 238, 0.12) 45%, transparent 70%);
    animation: bloomPulse 2.6s ease-in-out infinite;
    pointer-events: none;
  }

  #launcher {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    background: rgba(13, 19, 34, 0.88);
    backdrop-filter: blur(10px) saturate(1.4) brightness(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.4) brightness(1.1);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.5),
      inset 0 -2px 6px rgba(0, 0, 0, 0.35);
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 14px rgba(139, 92, 246, 0.5));
    transition: filter 0.25s ease, transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  #launcher .glyph {
    font-size: 40px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* Hovered (cursor resting on the button): the gem swells, the halo spins
     faster and the glyph pops — inviting a click. */
  body.hover #launcher {
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 22px rgba(167, 139, 250, 0.85));
    transform: scale(1.1);
  }
  body.hover #launcher-wrap::before {
    animation-duration: 2.4s;
    opacity: 1;
  }
  body.hover #launcher .glyph { transform: scale(1.18) rotate(18deg); }
  #launcher:active { transform: scale(0.94); }

  /* === Radial ring menu (opens around the launcher on click) === */
  #ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 280px;
    height: 280px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.3);
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  #ring.open {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.92); /* ~258px — fits the bigger window */
  }
  #ring.open .ring-seg { pointer-events: all; }

  /* Glass annulus backdrop (hole in the middle so the button shows through) */
  .ring-glass {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: rgba(9, 14, 27, 0.6);
    backdrop-filter: blur(16px) saturate(1.5) brightness(1.08);
    -webkit-backdrop-filter: blur(16px) saturate(1.5) brightness(1.08);
    box-shadow:
      0 14px 52px rgba(0, 0, 0, 0.55),
      0 0 140px rgba(139, 92, 246, 0.5),
      0 0 0 2px rgba(167, 139, 250, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.38),
      inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    -webkit-mask: radial-gradient(circle, transparent 0 88px, #000 90px 100%);
    mask: radial-gradient(circle, transparent 0 88px, #000 90px 100%);
    pointer-events: none;
  }
  /* Conic neon border — the ring's single border, sitting ON the glass edge */
  .ring-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      rgba(99, 102, 241, 1) 0%, rgba(56, 189, 248, 1) 12.5%, rgba(34, 211, 238, 1) 25%,
      rgba(52, 211, 153, 1) 37.5%, rgba(250, 204, 21, 1) 50%, rgba(244, 114, 182, 1) 62.5%,
      rgba(236, 72, 153, 1) 75%, rgba(167, 139, 250, 1) 87.5%, rgba(99, 102, 241, 1) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 6px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 calc(100% - 6px));
    animation: ringSpin 12s linear infinite;
    opacity: 0.9;
    pointer-events: none;
  }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  @keyframes haloSpin { to { transform: rotate(360deg); } }
  @keyframes bloomPulse {
    0%, 100% { transform: scale(0.94); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  /* Ring segments */
  #ring-segments {
    position: absolute;
    inset: 0;
    width: 280px;
    height: 280px;
    overflow: visible;
  }
  .ring-seg { cursor: pointer; }
  #ring:not(.open) .ring-seg { pointer-events: none; }
  .ring-seg path {
    stroke: rgba(255, 255, 255, 0.65);
    stroke-width: 1.6;
    transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
    filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.25));
  }
  .ring-seg .seg-icon {
    fill: #ffffff;
    font-size: 30px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    transition: filter 0.2s ease;
  }
  .ring-seg .seg-btn {
    stroke: rgba(255, 255, 255, 0.75);
    stroke-width: 1.6;
    transform-box: fill-box;
    transform-origin: center;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.42)) drop-shadow(0 0 10px var(--glow));
    transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
  }
  /* Per-action accent glow */
  .ring-seg[data-action="info"]       { --glow: #38bdf8; --glow-fill: rgba(56, 189, 248, 0.4); }
  .ring-seg[data-action="clipboard"]  { --glow: #2dd4bf; --glow-fill: rgba(45, 212, 191, 0.38); }
  .ring-seg[data-action="assistant"]  { --glow: #e879f9; --glow-fill: rgba(232, 121, 249, 0.4); }
  .ring-seg[data-action="notes"]      { --glow: #fbbf24; --glow-fill: rgba(251, 191, 36, 0.38); }
  .ring-seg[data-action="focus"]      { --glow: #a3e635; --glow-fill: rgba(163, 230, 53, 0.38); }
  .ring-seg[data-action="screenshot"] { --glow: #f472b6; --glow-fill: rgba(244, 114, 182, 0.42); }
  .ring-seg[data-action="settings"]   { --glow: #94a3b8; --glow-fill: rgba(148, 163, 184, 0.38); }

  /* Hover: the wedge glows with its accent (no pop-out — stays stable
     under the cursor). */
  .ring-seg:hover path {
    fill: var(--glow-fill);
    stroke: rgba(255, 255, 255, 0.7);
    filter: drop-shadow(0 0 18px var(--glow)) brightness(1.2);
  }
  .ring-seg:hover .seg-icon {
    filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55));
  }
  .ring-seg:hover .seg-btn {
    stroke: rgba(255, 255, 255, 0.9);
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.42)) drop-shadow(0 0 20px var(--glow)) brightness(1.15);
  }
  .ring-seg:active path { filter: brightness(0.9); }

  /* Clean glass tooltip (replaces the native title bubble) */
  .mini-tip {
    position: fixed;
    z-index: 20;
    max-width: 200px;
    padding: 6px 10px;
    border-radius: 9px;
    background: rgba(15, 23, 42, 0.96);
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    color: #e8edff;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.01em;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .mini-tip.visible { opacity: 1; transform: translateY(0); }

  /* === Assistant bubble: a small 💬 chip at the window's top-left corner
     ("top middle-left" of the launcher). Clicking it opens the assistant
     chat window that fills the left side of the screen. === */
  #assist-trigger {
    position: absolute;
    left: 12px;
    top: 12px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: rgba(13, 19, 34, 0.88);
    border: 2px solid rgba(167, 139, 250, 0.45);
    border-top: 1.5px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    cursor: pointer;
    z-index: 6;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, box-shadow 0.2s;
  }
  body.assist-hover #assist-trigger {
    transform: scale(1.14);
    border-color: rgba(167, 139, 250, 0.95);
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  #assist-trigger:active { transform: scale(0.93); }
</style>
</head>
<body>
  <div id="launcher-wrap">
    <div id="launcher"><span class="glyph">✦</span></div>
  </div>

  <!-- Assistant trigger: opens the left-side chat window -->
  <div id="assist-trigger" title="Assistant">💬</div>

  <!-- Radial ring menu -->
  <div id="ring">
    <div class="ring-glass"></div>
    <svg id="ring-segments" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script>
    // Defensive shim: everything needs the preload bridge; without it the
    // launcher stays inert (it only runs inside Electron anyway).
    const api = window.electronAPI || {
      openPanel() {}, openNotesPanel() {}, openScreenshotOverlay() {}, openAssistant() {},
      onButtonHover() {}, setRingOpen() {},
    };

    // === Ring menu actions — the app's feature menu (view switching lives
    // in the planner's own Tasks/Calendar/Week bar, so it's not here). ===
    const RING_ACTIONS = [
      { action: 'info',       icon: 'ℹ️',  label: 'Info & Weather' },
      { action: 'clipboard',  icon: '📋',  label: 'Clipboard History' },
      { action: 'assistant',  icon: '🗨️',  label: 'Assistant' },
      { action: 'notes',      icon: '📝',  label: 'Quick Notes' },
      { action: 'focus',      icon: '⏱️',  label: 'Focus Timer' },
      { action: 'screenshot', icon: '📷',  label: 'Screenshot' },
      { action: 'settings',   icon: '⚙️',  label: 'Settings' },
    ];
    const ACTION_COLORS = {
      info: '#38bdf8', clipboard: '#2dd4bf', assistant: '#e879f9', notes: '#fbbf24',
      focus: '#a3e635', screenshot: '#f472b6', settings: '#94a3b8',
    };

    function buildRingMenu() {
      const svg = document.getElementById('ring-segments');
      if (!svg || svg.childNodes.length) return;
      const NS = 'http://www.w3.org/2000/svg';
      const CX = 140, CY = 140;
      const R_OUT = 124, R_IN = 88;
      const ICON_R = (R_IN + R_OUT) / 2;
      const BTN_R = 19;                     // glass button behind each icon (bigger ring → bigger button)
      const N = RING_ACTIONS.length;
      const step = 360 / N;
      const gap = 1.4;
      const polar = (r, a) => {
        const rad = (a * Math.PI) / 180;
        return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
      };

      const defs = document.createElementNS(NS, 'defs');
      RING_ACTIONS.forEach((item) => {
        const c = ACTION_COLORS[item.action];
        const mk = (id, stops) => {
          const g = document.createElementNS(NS, 'linearGradient');
          g.setAttribute('id', id);
          g.setAttribute('x1', '0%'); g.setAttribute('y1', '0%');
          g.setAttribute('x2', '100%'); g.setAttribute('y2', '100%');
          stops.forEach(([off, col]) => {
            const s = document.createElementNS(NS, 'stop');
            s.setAttribute('offset', off);
            s.setAttribute('stop-color', col);
            g.appendChild(s);
          });
          defs.appendChild(g);
        };
        mk('seg-grad-' + item.action, [['0%', '#141e381f'], ['55%', c + '99'], ['100%', c + 'cc']]);
        mk('seg-grad-btn-' + item.action, [['0%', c + 'd9'], ['60%', c + '66'], ['100%', '#141e3873']]);
      });
      svg.appendChild(defs);

      RING_ACTIONS.forEach((item, i) => {
        const a0 = i * step - 90 - step / 2 + gap / 2;
        const a1 = (i + 1) * step - 90 - step / 2 - gap / 2;
        const [ox0, oy0] = polar(R_OUT, a0);
        const [ox1, oy1] = polar(R_OUT, a1);
        const [ix0, iy0] = polar(R_IN, a0);
        const [ix1, iy1] = polar(R_IN, a1);
        const large = (a1 - a0) > 180 ? 1 : 0;
        const d = `M ${ox0} ${oy0} L ${ix0} ${iy0} A ${R_IN} ${R_IN} 0 ${large} 1 ${ix1} ${iy1} L ${ox1} ${oy1} A ${R_OUT} ${R_OUT} 0 ${large} 0 ${ox0} ${oy0} Z`;

        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'ring-seg');
        g.setAttribute('data-action', item.action);
        g.setAttribute('data-icon', item.icon);
        g.setAttribute('data-tip', item.label);

        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'url(#seg-grad-' + item.action + ')');
        g.appendChild(path);

        const mid = i * step - 90;
        const [tx, ty] = polar(ICON_R, mid);
        const btn = document.createElementNS(NS, 'circle');
        btn.setAttribute('class', 'seg-btn');
        btn.setAttribute('cx', tx);
        btn.setAttribute('cy', ty);
        btn.setAttribute('r', BTN_R);
        btn.setAttribute('fill', 'url(#seg-grad-btn-' + item.action + ')');
        g.appendChild(btn);
        const text = document.createElementNS(NS, 'text');
        text.setAttribute('class', 'seg-icon');
        text.setAttribute('x', tx);
        text.setAttribute('y', ty);
        text.textContent = item.icon;
        g.appendChild(text);

        svg.appendChild(g);
      });
    }

    const ring = document.getElementById('ring');
    function openRing() {
      if (ring.classList.contains('open')) return;
      ring.classList.add('open');
      api.setRingOpen(true);
    }
    function closeRing() {
      if (!ring.classList.contains('open')) return;
      ring.classList.remove('open');
      api.setRingOpen(false);
    }

    // Click the gem to open/close the ring — no hover-hold, no countdown.
    document.getElementById('launcher-wrap').addEventListener('click', (e) => {
      e.stopPropagation();
      if (ring.classList.contains('open')) closeRing();
      else openRing();
    });

    // Hover state comes from main.js's cursor poll; the ring only closes
    // when the cursor leaves the whole window.
    api.onButtonHover((state) => {
      document.body.classList.toggle('hover', !!(state && state.active));
      document.body.classList.toggle('assist-hover', !!(state && state.assist));
      if (state && !state.inWindow) closeRing();
    });

    // The 💬 bubble opens the assistant chat window (left side of screen).
    document.getElementById('assist-trigger').addEventListener('click', (e) => {
      e.stopPropagation();
      closeRing();
      api.openAssistant();
    });

    // Ring segment clicks (delegated — segments are built dynamically).
    document.getElementById('ring-segments').addEventListener('click', (e) => {
      const seg = e.target.closest('.ring-seg');
      if (!seg) return;
      const action = seg.dataset.action;
      if (!action) return;
      closeRing();
      switch (action) {
        case 'notes':
          api.openNotesPanel();
          break;
        case 'screenshot':
          api.openScreenshotOverlay();
          break;
        default:
          api.openPanel(action);
      }
    });

    // === Clean glass tooltips (Comfortaa) for the ring segments ===
    const tipEl = document.createElement('div');
    tipEl.className = 'mini-tip';
    document.body.appendChild(tipEl);
    let tipTimer = null;
    function tipFor(el, text) {
      if (tipTimer) clearTimeout(tipTimer);
      tipTimer = setTimeout(() => {
        tipEl.textContent = text;
        const r = el.getBoundingClientRect();
        const w = Math.min(200, tipEl.offsetWidth || 120);
        const h = tipEl.offsetHeight || 26;
        const cw = document.documentElement.clientWidth;
        const ch = document.documentElement.clientHeight;
        let left = r.left + r.width / 2 - w / 2;
        left = Math.max(4, Math.min(left, cw - w - 4));
        const top = r.top > 70 ? r.top - h - 10 : r.bottom + 10;
        tipEl.style.left = left + 'px';
        tipEl.style.top = Math.max(4, Math.min(top, ch - h - 4)) + 'px';
        tipEl.classList.add('visible');
      }, 160);
    }
    function tipHide() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      tipEl.classList.remove('visible');
    }
    document.getElementById('ring-segments').addEventListener('mousemove', (e) => {
      const seg = e.target.closest('.ring-seg');
      if (seg && seg.dataset.tip) tipFor(seg, seg.dataset.tip);
      else tipHide();
    });
    document.getElementById('ring-segments').addEventListener('mouseleave', tipHide);

    buildRingMenu();
  </script>
</body>
</html>
