name: Build & release installers

# Builds the Windows installer (Squirrel .exe) and the macOS .dmg on their
# native platforms, then uploads them to the GitHub Release for the pushed
# tag. Triggered by pushing a version tag:
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# The Release is created automatically and receives these assets (named to
# match the landing page links):
#   - Halo-Setup.exe   (Windows installer)
#   - Halo.dmg         (macOS installer)
#   - Halo-Windows.zip (portable Windows build)
#   - Halo-macOS.zip   (portable macOS build)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Needed for azure/login OpenID Connect (OIDC) federated auth when the
  # optional Azure Artifact Signing step runs. Harmless when signing is off.
  id-token: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon (.ico)
        run: npm run icon

      - name: Build Windows installers
        run: npm run make

      # --- Optional cloud code-signing (Azure Artifact Signing) ---
      # Runs only when the AZURE_* secrets are configured. Signing the
      # Setup.exe + packaged app binaries removes the SmartScreen / Smart App
      # Control warnings over time. See CODE_SIGNING.md for the one-time Azure
      # setup. Releases still build and upload normally without it.
      - name: Azure login (Artifact Signing)
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries (Azure Artifact Signing)
        if: ${{ secrets.AZURE_CLIENT_ID != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: '${{ github.workspace }}\out'
          files-folder-filter: exe,dll
          files-folder-recurse: true
          timestamp-rfc3161: 'http://timestamp.acs.microsoft.com'
          timestamp-digest: SHA256
          timeout: 900

      - name: Collect + rename artifacts
        shell: bash
        run: |
          mkdir -p release
          # Match only THIS version's artifacts — a stale zip/exe from an
          # earlier local build would otherwise be picked up by a bare
          # `find ... | head -1` and uploaded under the wrong name.
          VERSION="$(node -p "require('./package.json').version")"
          cp "$(find out/make -name "*${VERSION}*Setup.exe" | head -1)" release/Halo-Setup.exe
          cp "$(find out/make -name "*${VERSION}*.zip" | head -1)" release/Halo-Windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

  macos:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # generate-icon.js writes the .ico AND the .iconset PNGs (letterboxed
      # from wolf.png); iconutil assembles the .icns the packager needs.
      - name: Generate app icons (.ico + .iconset -> .icns)
        shell: bash
        run: |
          npm run icon
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build macOS DMG + zip
        run: npm run make

      - name: Collect + rename artifacts
        shell: bash
        run: |
          mkdir -p release
          # maker-dmg outputs "Halo.dmg" (no version in filename), so a
          # version-filtered find returns nothing and cp silently fails.
          # The CI checkout is clean so there's only one .dmg / .zip.
          cp "$(find out/make -name '*.dmg' | head -1)" release/Halo.dmg
          cp "$(find out/make -name '*.zip' | head -1)" release/Halo-macOS.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
