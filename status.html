<!DOCTYPE html>
<html lang="en">
<head>
<title>EZCompanion</title>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: stretch;
    font-family: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    /* Purely informational: never interactive — main.js keeps the window
       click-through so every click passes straight to what's underneath. */
    pointer-events: none;
  }
  /* Slim overlay title bar — the window is sized (in main.js) to the same
     width and right edge as the planner sidebar, so this reads as the app's
     own slim title strip pinned above it. */
  #status {
    position: relative;
    flex: 1;
    /* 8px side margins match the planner glass (which sits 8px inside its
       window), so the status bar and planner share the same left/right edges */
    margin: 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    border-radius: 14px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    -webkit-backdrop-filter: blur(16px) saturate(1.35) brightness(1.05);
    border: 1px solid rgba(var(--accent), 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
      inset 0 0 12px rgba(var(--accent), 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 4px 24px rgba(0, 0, 0, 0.45),
      0 0 0 1px rgba(var(--accent), 0.12),
      0 0 20px rgba(var(--accent), 0.14);
    color: #e8edff;
    white-space: nowrap;
  }
  /* Glass sheen sweeping across the bar + LED light strip along its top
     edge (masked to the top 2px). */
  #status::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(34, 211, 238, 0.85), rgba(139, 92, 246, 0.9) 30%, rgba(236, 72, 153, 0.85) 60%, rgba(52, 211, 153, 0.85)),
      radial-gradient(120% 80% at 18% -30%, rgba(255, 255, 255, 0.22), transparent 55%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 45%);
    -webkit-mask: linear-gradient(180deg, #000 0 2px, transparent 2px 100%);
    mask: linear-gradient(180deg, #000 0 2px, transparent 2px 100%);
    filter: saturate(1.2) brightness(1.15);
  }
  /* Brand mark: gradient monogram chip + app name */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #0b1020;
    background: #22d3ee;
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .appname {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #eef2ff;
    text-shadow: 0 0 14px rgba(99, 102, 241, 0.35);
  }
  /* Solid bright text — no gradient-clip (it faded the tail of the name). */
  .divider {
    width: 1px;
    height: 16px;
    background: linear-gradient(180deg, transparent, rgba(167, 139, 250, 0.75), transparent);
    flex-shrink: 0;
  }
  .spacer { flex: 1; }
  /* Live status cluster on the right */
  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .label {
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: rgba(199, 210, 254, 0.6);
  }
  .dot {
    position: relative;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px rgba(52, 211, 153, 0.95);
    animation: pulse 2s ease-in-out infinite;
  }
  .dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid rgba(52, 211, 153, 0.5);
    opacity: 0;
    animation: ping 2.2s ease-out infinite;
  }
  #stext {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.7; }
  }
  @keyframes ping {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* Planner-matched accent (synced from the daily protocol) */
  :root { --accent: 0, 242, 255; --accent-hex: #00f2ff; }
  body[data-protocol="productive"] { --accent: 56, 189, 248;  --accent-hex: #38bdf8; }
  body[data-protocol="workout"]    { --accent: 251, 113, 133; --accent-hex: #fb7185; }
  body[data-protocol="rest"]       { --accent: 167, 139, 250; --accent-hex: #a78bfa; }
  body[data-protocol="play"]       { --accent: 52, 211, 153;  --accent-hex: #34d399; }
  /* Neon LED strip along the top edge (matches the planner) */
  #status::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(139, 92, 246, 0.95) 30%, rgba(236, 72, 153, 0.9) 60%, rgba(52, 211, 153, 0.9));
    -webkit-mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    mask: linear-gradient(180deg, #000 0 3px, transparent 3px 100%);
    opacity: 0.9;
  }
    /* Navy gradient border + black middle (matches the planner's colored panes) */
  #status {
    background:
      linear-gradient(160deg, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
      radial-gradient(130% 90% at 0% 0%, rgba(30, 64, 175, 0.34), transparent 55%),
      radial-gradient(130% 90% at 100% 100%, rgba(37, 99, 235, 0.26), transparent 55%),
      rgba(2, 5, 11, 0.86);
    border: 1.5px solid rgba(59, 130, 246, 0.5);
    box-shadow:
      inset 0 0 26px rgba(30, 64, 175, 0.24),
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 18px 50px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(59, 130, 246, 0.25),
      0 0 36px rgba(30, 64, 175, 0.28);
  }
  </style>
<script>
  // The app ships with a single signature look: the black glass theme.
  document.body.dataset.theme = 'black';
</script>
</head>
<body>
<div id="status" data-summon>
  <span class="brand">
    <span class="brand-mark">E</span>
    <span class="appname">EZCompanion</span>
  </span>
  <span class="divider"></span>
  <span class="spacer"></span>
  <span class="live">
    <span class="dot"></span>
    <span class="label">Status</span>
    <span id="stext">Active</span>
  </span>
</div>
<script>
  (function () {
    var api = window.electronAPI;
    function apply(p) {
      if (p === 'productive' || p === 'workout' || p === 'rest' || p === 'play') document.body.dataset.protocol = p;
      else delete document.body.dataset.protocol;
    }
    if (api && api.onProtocol) api.onProtocol(apply);
    if (api && api.getProtocol) api.getProtocol();
  })();
</script>
<script src="summon.js"></script>
</body>
</html>
